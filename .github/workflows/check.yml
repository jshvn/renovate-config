# Renovate's own validator over the preset and this repository's config, on every pull request
# and every push to main. A preset that fails to parse stops Renovate in every repository that
# extends it, so this is the check that matters here.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ponytail: the validator floats on :latest because Mend's hosted app runs the latest
      # Renovate, so this checks against the schema every consumer gets. Ceiling: the same commit
      # can pass one week and fail the next when a release deprecates an option; pin by digest
      # if a reproducible run ever matters more than tracking the app.
      - run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/renovatebot/renovate:latest
          renovate-config-validator --strict --no-global default.json renovate.json
